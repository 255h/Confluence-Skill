name: Build and Release

on:
  release:
    types: [created, edited]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --onefile --name confluence-skill scripts/confluence.py
          ls -la dist/

      - name: Package Linux release
        run: |
          mkdir -p confluence-skill-linux/scripts
          cp dist/confluence-skill confluence-skill-linux/scripts/
          cp README.md confluence-skill-linux/
          cp SKILL.md confluence-skill-linux/
          cp -r references confluence-skill-linux/
          # Do NOT include Python script
          
          zip -r confluence-skill-linux.zip confluence-skill-linux/
          ls -la

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: confluence-skill-linux
          path: confluence-skill-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --name confluence-skill.exe scripts/confluence.py

      - name: Package Windows release
        run: |
          mkdir confluence-skill-windows
          mkdir confluence-skill-windows\scripts
          copy dist\confluence-skill.exe confluence-skill-windows\scripts\
          copy README.md confluence-skill-windows\
          copy SKILL.md confluence-skill-windows\
          xcopy references confluence-skill-windows\references /E /I
          # Do NOT include Python script
          
          Compress-Archive -Path confluence-skill-windows\* -DestinationPath confluence-skill-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: confluence-skill-windows
          path: confluence-skill-windows.zip

  attach-to-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: confluence-skill-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: confluence-skill-windows
          path: artifacts

      - name: Attach assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} artifacts/confluence-skill-linux.zip
          gh release upload ${{ github.event.release.tag_name }} artifacts/confluence-skill-windows.zip
        continue-on-error: false